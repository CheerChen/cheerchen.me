name: Refresh post views

on:
  schedule:
    # Every 3 days at 04:00 UTC (13:00 JST)
    - cron: '0 4 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-views
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Write GA OAuth credentials
        env:
          ADC_JSON: ${{ secrets.GA_ADC_JSON }}
        run: |
          mkdir -p "$HOME/.config/gcloud"
          printf '%s' "$ADC_JSON" > "$HOME/.config/gcloud/application_default_credentials.json"

      - name: Fetch latest views from GA
        env:
          GA4_PROPERTY_ID: '499292123'
        run: |
          mkdir -p data
          uv run scripts/ga-preview-views.py --output-json data/views.json

      # views.json lives on the orphan `site-data` branch (one squashed commit,
      # force-replaced on every change) so the main branch history stays clean.
      # The Cloudflare Pages build command fetches it from raw.githubusercontent
      # before running hugo.
      - name: Push to site-data branch if changed
        run: |
          git fetch origin site-data --no-tags --depth 1
          new=$(sha1sum data/views.json | cut -d' ' -f1)
          old=$(git show origin/site-data:views.json 2>/dev/null | sha1sum | cut -d' ' -f1)
          if [ "$new" = "$old" ]; then
            echo "No changes to views.json; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w data/views.json)
          tree=$(printf '100644 blob %s\tviews.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "chore(views): refresh from GA")
          git push --force origin "$commit:refs/heads/site-data"
