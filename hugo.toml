# 网站的根地址，必须设置为您的域名
baseURL = 'https://cheerchen.me/'
# 网站的默认语言
locale = 'zh-Hans'
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false
# 网站的标题
title = "CheerChen's Blog"

# 使用的主题
theme = 'dream'

hasCJKLanguage = true
enableRobotsTXT = true

[pagination]
pagerSize = 20

# 多语言配置
[languages]
[languages.zh]
locale = 'zh-Hans'
label = 'ZH'
title = "CheerChen's Blog"
weight = 1
[languages.zh.params]
headerTitle = "CheerChen's Blog"
motto = "在日本写云、AI、架构和工程实践"
author = "CheerChen"
avatar = "3284997.png"
description = "CheerChen 的技术博客，专注于云原生、Kubernetes、AWS、AI 等前沿技术分享"
[languages.zh.params.experimental]
jsDateFormat = "yyyy年MM月dd日"

[languages.ja]
locale = 'ja'
label = 'JP'
title = "CheerChen's Blog"
weight = 2
[languages.ja.params]
headerTitle = "CheerChen's Blog"
motto = "日本からクラウド、AI、アーキテクチャ、開発のことを書く"
author = "CheerChen"
avatar = "3284997.png"
description = "クラウドネイティブ、Kubernetes、AWS、AI などなど"
[languages.ja.params.experimental]
jsDateFormat = "yyyy年MM月dd日"

[languages.en]
locale = 'en'
label = 'EN'
title = "CheerChen's Blog"
weight = 3
[languages.en.params]
headerTitle = "CheerChen's Blog"
motto = "Writing about cloud, AI, architecture, and engineering from Japan"
author = "CheerChen"
avatar = "3284997.png"
description = "CheerChen's tech blog — cloud-native, Kubernetes, AWS, AI, and more"
[languages.en.params.experimental]
jsDateFormat = "MMMM d, yyyy"

[markup]
[markup.highlight]
noClasses = false
lineNos = true
lineNumbersInTable = false
anchorLineNos = false
codeFences = true
guessSyntax = true
tabWidth = 4

[params.advanced]
customCSS = ["custom.css"]

[params]
customSyntaxHighlighting = true
lightTheme = "emerald"
darkTheme = "forest"
showTableOfContents = true
showSummaryCoverInPost = true
imageZoomableInPost = true
showPrevNextPost = true
favicon = "favicon.ico"

# -- 开启禅定模式 --
# zenMode = true

[params.experimental]
jsDate = true
jsDateFormat = "yyyy年MM月dd日"

# Sitemap 配置
[sitemap]
changefreq = "weekly"
priority = 0.8
filename = "sitemap.xml"

# 允许 HTML 标签，用于结构化数据
[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [["$$", "$$"]]
inline = [["$", "$"]]

[services]
[services.googleAnalytics]
ID = 'G-GVR7W9ZBBP'

# llms.txt — auto-generated index for AI assistants
[mediaTypes."text/llms-txt"]
suffixes = ["txt"]

[outputFormats.llms-txt]
mediaType = "text/llms-txt"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputs]
home = ["html", "rss", "llms-txt"]
