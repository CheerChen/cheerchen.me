<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TGIF: vote, rank, answer live</title>
  <desc id="desc">Three steps left to right. Employees vote on question cards ahead of time; a voting app on a phone ranks the top-voted questions; executives on stage answer them live with a microphone.</desc>
