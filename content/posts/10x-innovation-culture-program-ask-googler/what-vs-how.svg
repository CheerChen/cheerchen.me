<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Set the WHAT, not the HOW</title>
  <desc id="desc">Two comic panels. Left: a manager reads out every step of the trip to Shinagawa Station and the team member is overwhelmed. Right: the manager only says meet at Shinagawa Station at 7:00 and offers help; people arrive on foot, by bike and running, and celebrate at the station.</desc>
