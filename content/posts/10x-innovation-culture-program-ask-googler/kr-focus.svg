<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Watch the top 2 KRs, let the rest run</title>
  <desc id="desc">A manager's 10 key results sorted by weight. The two heaviest are marked as the focus. The rest are split by type: quantitative ones are tracked by their number, qualitative ones are confirmed in a short check-in conversation.</desc>
