<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Local Mac Workers and Remote Coordinator</title>
  <desc id="desc">Local Mac runs parallel agents with Bitwarden CLI and task-template.md, exchanging need-otp.json, otp.txt, and result.json with the remote Grok Bot and human.</desc>
