    .cap{font-size:18px;font-weight:600}
    .b{font-size:19px;font-weight:700}
    .h{font-size:17px;font-weight:700}
    .t{font-size:16px}
    .s{font-size:14px}
    .t-dim{font-size:16px;fill:#6b7f72}
    .s-dim{font-size:14px;fill:#6b7f72}
    .sign{font-size:15px;font-weight:700}
    .num{font-size:15px;font-weight:700;fill:#ffffff}
  </style>
