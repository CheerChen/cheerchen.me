<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Why run multiple regions?</title>
  <desc id="desc">Real-time calls need low-latency server connections, so SFU servers run in multiple AWS Regions and each user connects to the nearest one. With a single region, a Switch far from the only SFU server sees a round trip of about 500 ms; with SFU servers in several regions, the nearest one cuts it to about 50 ms. The numbers are illustrative.</desc>
