<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Handling the read inconsistency</title>
  <desc id="desc">Two flows. A normal invite round-trips through the client: friend selection, join processing, send notification. An extra invite completes inside the server: the chat in progress plus friend selection, then send notification. The member list comes from the chat the initiator is already in, so the server skips a possibly stale read.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}text:where(:not([fill])){fill:#232f3e}</style>
  <rect width="1200" height="675" fill="#e4e7eb"/>
  <rect x="16" y="20" width="1168" height="643" rx="14" fill="#c9ced4"/>
  <rect x="14" y="14" width="1172" height="645" rx="14" fill="#ffffff" stroke="#cfd4da" stroke-width="1.5"/>
<text x="1130" y="62" font-size="20" fill="#5f6b7a" text-anchor="end" text-decoration="underline">Read inconsistency on extra invites</text>
<text x="70" y="138" font-size="44" font-weight="700">Handling the read inconsistency</text>
<polygon points="82,203.88 96,212.56 82,221.24" fill="#e8412c"/>
<text x="110" y="220" font-size="26">A normal invite round-trips through the client</text>
<rect x="110" y="250" width="260" height="70" rx="10" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/><text x="240.0" y="293.0" font-size="22" text-anchor="middle">Friend selection</text>
<rect x="440" y="250" width="260" height="70" rx="10" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/><text x="570.0" y="293.0" font-size="22" text-anchor="middle">Join processing</text>
<rect x="770" y="250" width="260" height="70" rx="10" fill="#ffffff" stroke="#b9c0c8" stroke-width="2"/><text x="900.0" y="293.0" font-size="22" text-anchor="middle">Send notification</text>
<path d="M396,269 L412,285 L396,301" fill="none" stroke="#5f6b7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M726,269 L742,285 L726,301" fill="none" stroke="#5f6b7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="82,383.88 96,392.56 82,401.24" fill="#e8412c"/>
<text x="110" y="400" font-size="26">An extra invite completes inside the server</text>
<rect x="110" y="430" width="260" height="70" rx="10" fill="#e7f3fb" stroke="#139ad6" stroke-width="3"/><text x="240.0" y="473.0" font-size="22" font-weight="700" text-anchor="middle">Chat in progress</text>
<rect x="440" y="430" width="260" height="70" rx="10" fill="#e7f3fb" stroke="#139ad6" stroke-width="3"/><text x="570.0" y="473.0" font-size="22" font-weight="700" text-anchor="middle">Friend selection</text>
<rect x="770" y="430" width="260" height="70" rx="10" fill="#e7f3fb" stroke="#139ad6" stroke-width="3"/><text x="900.0" y="473.0" font-size="22" font-weight="700" text-anchor="middle">Send notification</text>
<path d="M391,465 H419 M405,451 V479" stroke="#5f6b7a" stroke-width="4.5" stroke-linecap="round"/><path d="M726,449 L742,465 L726,481" fill="none" stroke="#5f6b7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="110" y="550" font-size="18" fill="#5f6b7a">The member list comes from the chat the initiator is already in, so the server skips a possibly stale read.</text>
<g transform="translate(1124,619) scale(1.0)"><rect x="-26" y="-18" width="52" height="36" rx="3" fill="#ffffff" stroke="#232f3e" stroke-width="2.5"/><text x="0" y="6" font-size="17" font-weight="700" text-anchor="middle">29</text><rect x="-40" y="-20" width="14" height="40" rx="7" fill="#139ad6" stroke="#232f3e" stroke-width="2"/><rect x="26" y="-20" width="14" height="40" rx="7" fill="#e8412c" stroke="#232f3e" stroke-width="2"/><circle cx="-33" cy="-8" r="2.5" fill="#ffffff"/><circle cx="33" cy="6" r="2.5" fill="#ffffff"/></g>
</svg>
