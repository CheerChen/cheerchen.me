<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">What building on DynamoDB taught us</title>
  <desc id="desc">What worked: designing for DynamoDB from the start delivered the expected performance and scalability from day one. Watch out: when use cases change, processing order or displayed information shifts, a redesign may be needed, and DynamoDB does not suit a phase where the UX still needs trial and error. Choose the database that fits the system and how it is being built.</desc>
