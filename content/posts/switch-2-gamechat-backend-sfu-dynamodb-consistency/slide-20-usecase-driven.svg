<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Use-case-driven design</title>
  <desc id="desc">Five steps in a row: draft a provisional RDB data model, design the APIs, list the use cases, derive access patterns from the use cases, and choose keys and facets to fit the access patterns. Know how the system reads before deciding how it stores.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}text:where(:not([fill])){fill:#232f3e}</style>
