or="middle">Derive access</text><text x="821" y="389" font-size="20" text-anchor="middle">patterns from</text><text x="821" y="415" font-size="20" text-anchor="middle">the use cases</text><path d="M924,333.0 L937,345.0 L924,357.0" fill="none" stroke="#5f6b7a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="953" y="250" width="177" height="190" rx="12" fill="#f3f4f6" stroke="#e8412c" stroke-width="2.5"/><circle cx="1042" cy="290" r="20" fill="#e8412c"/><text x="1042" y="297" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="1042" y="350" font-size="20" text-anchor="middle">Choose keys</text><text x="1042" y="376" font-size="20" text-anchor="middle">and facets to</text><text x="1042" y="402" font-size="20" text-anchor="middle">fit the access</text><text x="1042" y="428" font-size="20" text-anchor="middle">patterns</text>
