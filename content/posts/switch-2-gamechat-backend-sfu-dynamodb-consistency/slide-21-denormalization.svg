<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Denormalization</title>
  <desc id="desc">A table whose items hold a list of users inline: Key01 lists Mario, Bowser and Yoshi, Key02 lists Mario and Bowser. Lists are kept inside the item instead of being normalized, so one query returns everything needed.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}text:where(:not([fill])){fill:#232f3e}</style>
  <rect width="1200" height="675" fill="#e4e7eb"/>
  <rect x="16" y="20" width="1168" height="643" rx="14" fill="#c9ced4"/>
  <rect x="14" y="14" width="1172" height="645" rx="14" fill="#ffffff" stroke="#cfd4da" stroke-width="1.5"/>
<text x="1130" y="62" font-size="20" fill="#5f6b7a" text-anchor="end" text-decoration="underline">Design priorities</text>
<text x="70" y="138" font-size="44" font-weight="700">Denormalization</text>
<rect x="570" y="176" width="560" height="52" fill="#3a3f46"/><rect x="570" y="228" width="560" height="100" fill="#f3f4f6"/><rect x="570" y="328" width="560" height="74" fill="#e9ebee"/><line x1="570" y1="328" x2="1130" y2="328" stroke="#ffffff" stroke-width="3"/><text x="665.0" y="209" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Partition Key</text><text x="665.0" y="285" font-size="20" text-anchor="middle">Key01</text><text x="665.0" y="372" font-size="20" text-anchor="middle">Key02</text><text x="845.0" y="209" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Value</text><text x="845.0" y="285" font-size="20" text-anchor="middle">Value01</text><text x="845.0" y="372" font-size="20" text-anchor="middle">Value02</text><line x1="760" y1="176" x2="760" y2="402" stroke="#ffffff" stroke-width="3"/><text x="1030.0" y="209" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">List</text><text x="1030.0" y="259" font-size="20" text-anchor="middle">User01 - Mario</text><text x="1030.0" y="285" font-size="20" text-anchor="middle">User02 - Bowser</text><text x="1030.0" y="311" font-size="20" text-anchor="middle">User03 - Yoshi</text><text x="1030.0" y="359" font-size="20" text-anchor="middle">User01 - Mario</text><text x="1030.0" y="385" font-size="20" text-anchor="middle">User02 - Bowser</text><line x1="930" y1="176" x2="930" y2="402" stroke="#ffffff" stroke-width="3"/>
<polygon points="82,463.88 96,472.56 82,481.24" fill="#e8412c"/>
<text x="110" y="480" font-size="26">Skip normalization: keep lists and similar data inside the item as-is</text>
<polygon points="82,512.98 96,521.66 82,530.34" fill="#e8412c"/>
<text x="110" y="529" font-size="26">Shape items so a single query returns everything you need</text>
<g transform="translate(1124,619) scale(1.0)"><rect x="-26" y="-18" width="52" height="36" rx="3" fill="#ffffff" stroke="#232f3e" stroke-width="2.5"/><text x="0" y="6" font-size="17" font-weight="700" text-anchor="middle">21</text><rect x="-40" y="-20" width="14" height="40" rx="7" fill="#139ad6" stroke="#232f3e" stroke-width="2"/><rect x="26" y="-20" width="14" height="40" rx="7" fill="#e8412c" stroke="#232f3e" stroke-width="2"/><circle cx="-33" cy="-8" r="2.5" fill="#ffffff"/><circle cx="33" cy="6" r="2.5" fill="#ffffff"/></g>
</svg>
