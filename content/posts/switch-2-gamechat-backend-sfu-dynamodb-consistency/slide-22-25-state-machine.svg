<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">GameChat start flow</title>
  <desc id="desc">Animated, four frames, slides 22 to 25. The GameChat start flow runs friend selection, reserved, authenticated, connected, send notification; the group server owns the three middle states. Frame 2: the Switch 2 sends the member info to the group server. Frame 3: the SFU server reports the established connection and the host's Switch 2 enters the chat. Frame 4: the state is connected, the host's chat is connected, and the invitee is notified asynchronously.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}text:where(:not([fill])){fill:#232f3e}</style>
  <rect width="1200" height="675" fill="#e4e7eb"/>
