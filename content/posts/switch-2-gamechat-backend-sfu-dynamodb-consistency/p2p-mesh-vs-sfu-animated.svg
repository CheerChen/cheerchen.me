<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">P2P mesh vs SFU: connection topology</title>
  <desc id="desc">Animated comparison. In a 4-client P2P mesh every client sends a stream to each of the other three, 6 links in all; with 12 clients that grows to 66 links and 11 uploads per client. With an SFU each client sends one stream to the server, which forwards the others' streams back: 4 links for 4 clients, 12 for 12, and still one upload per client.</desc>
  <style>
    text{font-family:'Amazon Ember',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    text:where(:not([fill])){fill:#232f3e}
    .title{font-size:26px;font-weight:700}
    .lbl{font-size:13px}
    .grp{font-size:14px;font-weight:600}
    .role{font-size:14px;font-weight:700}
    .note{font-size:13px;fill:#5f6b7a}
  </style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d13212"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d8102"/></marker></defs>
  <rect width="1200" height="640" fill="#ffffff"/>
<style>
  .st{fill:none;stroke-width:3;stroke-dasharray:8 8;stroke-linecap:round;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-16}}
  @media (prefers-reduced-motion:reduce){.st{animation:none}}
</style>
<rect x="20" y="20" width="560" height="560" rx="14" fill="#f7f8f9" stroke="#d5d9de" stroke-width="1.5"/><text x="300" y="62" class="title" text-anchor="middle">P2P mesh</text><text x="300" y="88" class="note" text-anchor="middle">every client sends to every other client</text><text x="300" y="520" class="lbl" font-weight="700" text-anchor="middle">4 clients: 6 links, each sends 3 streams and receives 3</text><text x="300" y="544" class="lbl" text-anchor="middle">12 clients: 66 links, 11 up and 11 down per client</text>
