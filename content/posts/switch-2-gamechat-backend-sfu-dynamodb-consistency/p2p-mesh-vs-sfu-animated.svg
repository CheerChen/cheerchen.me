<rect x="620" y="20" width="560" height="560" rx="14" fill="#f7f8f9" stroke="#d5d9de" stroke-width="1.5"/><text x="900" y="62" class="title" text-anchor="middle">SFU</text><text x="900" y="88" class="note" text-anchor="middle">each client sends once; the SFU forwards selectively</text><text x="900" y="520" class="lbl" font-weight="700" text-anchor="middle">4 clients: 4 links, each sends 1 stream</text><text x="900" y="544" class="lbl" text-anchor="middle">12 clients: 12 links, still 1 upload per client</text>
