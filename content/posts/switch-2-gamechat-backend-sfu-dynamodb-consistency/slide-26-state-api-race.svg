<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Server state and API access</title>
  <desc id="desc">Three states in order: reserved, authenticated, connected. The server state is authenticated, while the client UI already shows the chat screen as if connected. An API call that needs the connected state is denied.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}text:where(:not([fill])){fill:#232f3e}</style>
  <rect width="1200" height="675" fill="#e4e7eb"/>
  <rect x="16" y="20" width="1168" height="643" rx="14" fill="#c9ced4"/>
  <rect x="14" y="14" width="1172" height="645" rx="14" fill="#ffffff" stroke="#cfd4da" stroke-width="1.5"/>
<text x="1130" y="62" font-size="20" fill="#5f6b7a" text-anchor="end" text-decoration="underline">State transitions and eventual consistency</text>
<text x="70" y="138" font-size="44" font-weight="700">Server state and API access</text>
<circle cx="300" cy="452" r="80" fill="#ffffff" stroke="#b9c0c8" stroke-width="3" stroke-dasharray="9,7"/><text x="300" y="460" font-size="22" fill="#5f6b7a" text-anchor="middle">Reserved</text>
<path d="M441,436 L457,452 L441,468" fill="none" stroke="#5f6b7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="600" cy="452" r="80" fill="#e7f3fb" stroke="#139ad6" stroke-width="4"/><text x="600" y="460" font-size="22" font-weight="700" text-anchor="middle">Authenticated</text>
<path d="M741,436 L757,452 L741,468" fill="none" stroke="#5f6b7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="900" cy="452" r="80" fill="#ffffff" stroke="#b9c0c8" stroke-width="3" stroke-dasharray="9,7"/><text x="900" y="460" font-size="22" fill="#5f6b7a" text-anchor="middle">Connected</text>
<text x="600" y="352" font-size="18" font-weight="700" fill="#139ad6" text-anchor="middle">server state</text>
<rect x="800" y="176" width="200" height="112" rx="8" fill="#ffffff" stroke="#232f3e" stroke-width="2.5"/><rect x="812" y="188" width="176" height="56" rx="4" fill="#dbe9f4"/><rect x="812" y="252" width="38" height="26" rx="3" fill="#e9ebee"/><rect x="858" y="252" width="38" height="26" rx="3" fill="#e9ebee"/><rect x="904" y="252" width="38" height="26" rx="3" fill="#e9ebee"/><rect x="950" y="252" width="38" height="26" rx="3" fill="#e9ebee"/><line x1="900" y1="288" x2="900" y2="302" stroke="#232f3e" stroke-width="2.5"/>
<g transform="translate(900,324) scale(0.8)"><rect x="-26" y="-18" width="52" height="36" rx="3" fill="#ffffff" stroke="#232f3e" stroke-width="2.5"/><rect x="-40" y="-20" width="14" height="40" rx="7" fill="#232f3e" stroke="#232f3e" stroke-width="2"/><rect x="26" y="-20" width="14" height="40" rx="7" fill="#232f3e" stroke="#232f3e" stroke-width="2"/><circle cx="-33" cy="-8" r="2.5" fill="#ffffff"/><circle cx="33" cy="6" r="2.5" fill="#ffffff"/></g>
<text x="782" y="236" font-size="18" font-weight="700" fill="#232f3e" text-anchor="end">client UI:</text><text x="782" y="260" font-size="18" fill="#5f6b7a" text-anchor="end">already in the chat</text>
<rect x="790" y="552" width="220" height="44" rx="8" fill="#e8412c"/><text x="900" y="581" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">API access denied!</text>
<line x1="900" y1="532" x2="900" y2="552" stroke="#e8412c" stroke-width="3"/>
<g transform="translate(1124,619) scale(1.0)"><rect x="-26" y="-18" width="52" height="36" rx="3" fill="#ffffff" stroke="#232f3e" stroke-width="2.5"/><text x="0" y="6" font-size="17" font-weight="700" text-anchor="middle">26</text><rect x="-40" y="-20" width="14" height="40" rx="7" fill="#139ad6" stroke="#232f3e" stroke-width="2"/><rect x="26" y="-20" width="14" height="40" rx="7" fill="#e8412c" stroke="#232f3e" stroke-width="2"/><circle cx="-33" cy="-8" r="2.5" fill="#ffffff"/><circle cx="33" cy="6" r="2.5" fill="#ffffff"/></g>
</svg>
