<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Consistent Read</title>
  <desc id="desc">Consistent Read gives strongly consistent reads: always consistent, but it consumes more capacity units. The diagram shows an application reading DynamoDB, which replicates across three Availability Zones; the strongly consistent read goes to AZ1. This time, design work made eventual consistency acceptable, so Consistent Read was not adopted.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}text:where(:not([fill])){fill:#232f3e}</style>
  <rect width="1200" height="675" fill="#e4e7eb"/>
  <rect x="16" y="20" width="1168" height="643" rx="14" fill="#c9ced4"/>
  <rect x="14" y="14" width="1172" height="645" rx="14" fill="#ffffff" stroke="#cfd4da" stroke-width="1.5"/>
<text x="1130" y="62" font-size="20" fill="#5f6b7a" text-anchor="end" text-decoration="underline">Read inconsistency on extra invites</text>
<text x="70" y="138" font-size="44" font-weight="700">Consistent Read</text>
<polygon points="82,203.88 96,212.56 82,221.24" fill="#e8412c"/>
<text x="110" y="220" font-size="26">Setting it gives strongly consistent</text>
<text x="110" y="255" font-size="26">reads</text>
<polygon points="82,288.08 96,296.76 82,305.44" fill="#e8412c"/>
<text x="110" y="304" font-size="26">Always consistent, but consumes more</text>
<text x="110" y="339" font-size="26">capacity units</text>
<polygon points="82,372.28 96,380.96 82,389.64" fill="#e8412c"/>
<text x="110" y="388" font-size="26">This time, design work made eventual</text>
<text x="110" y="424" font-size="26">consistency acceptable</text>
<text x="110" y="485" font-size="26" font-weight="700" fill="#e8412c" text-decoration="underline">so it was not adopted</text>
<rect x="650" y="350" width="470" height="210" rx="8" fill="none" stroke="#5f6b7a" stroke-width="1.5" stroke-dasharray="6,5"/>
