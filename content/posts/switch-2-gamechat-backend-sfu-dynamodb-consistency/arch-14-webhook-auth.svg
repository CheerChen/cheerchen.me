    text{font-family:'Amazon Ember',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    text:where(:not([fill])){fill:#232f3e}
    .title{font-size:26px;font-weight:700}
    .lbl{font-size:13px}
    .grp{font-size:14px;font-weight:600}
    .role{font-size:14px;font-weight:700}
    .note{font-size:13px;fill:#5f6b7a}
  </style>
