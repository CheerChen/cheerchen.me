<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Auth webhook flow</title>
  <desc id="desc">1: the Switch 2 sends a WebRTC connection request to the SFU server. 2: the SFU server sends an auth request to the group server, carrying user info, target instance, timestamp, access token and WebRTC settings. 3: the group server checks it. 4: it answers 200 OK. 5: the SFU server completes the connection and media starts.</desc>
