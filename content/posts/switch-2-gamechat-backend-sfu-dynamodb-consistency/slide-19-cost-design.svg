<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Designing for cost efficiency</title>
  <desc id="desc">DynamoDB is a key-value store. A user reads from and writes to a table of partition keys, sort keys and values; the write arrow is marked as the more expensive one. Consumed capacity units vary with access type and item size.</desc>
