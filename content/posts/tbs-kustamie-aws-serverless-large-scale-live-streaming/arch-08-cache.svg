<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Multi-tier caching</title>
  <desc id="desc">Three cache tiers on the request path. 1: the API Gateway stage answers GET requests from its API cache and responds straight back on a hit. 2: global variables in a Lambda compute environment, such as an ID-to-user-name map with a TTL, survive hot starts. 3: Amazon ECS reads through Amazon ElastiCache before Amazon RDS.</desc>
