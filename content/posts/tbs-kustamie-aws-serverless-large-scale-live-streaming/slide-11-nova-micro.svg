<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">High-speed moderation with Amazon Nova Micro</title>
  <desc id="desc">Batch JSON input, Amazon Bedrock Nova Micro moderation prompt, and structured JSON output with 1.6 second latency.</desc>
  <rect width="1200" height="675" fill="#fbfbf8"/>
  <text x="72" y="78" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="34" fill="#365f52">Amazon Nova を使った高速モデレーション</text>
  <text x="1070" y="78" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#33426f">TBS</text>
  <line x1="72" y1="98" x2="1060" y2="98" stroke="#c8d0ca" stroke-width="3"/>
  <text x="90" y="150" font-family="Avenir" font-size="23" fill="#4b5853">Amazon Nova Micro を使って、多言語対応の高速モデレーションを実現</text>
  <g transform="translate(80 210)">
    <rect x="0" y="0" width="420" height="350" fill="#fff" stroke="#8797c7" stroke-width="2"/>
    <text x="18" y="32" font-family="Menlo, monospace" font-size="12.5" fill="#4b5853" xml:space="preserve">[</text>
    <text x="34" y="58" font-family="Menlo, monospace" font-size="12.5" fill="#4b5853" xml:space="preserve">{ "message_id": "78b8...",</text>
    <text x="34" y="78" font-family="Menlo, monospace" font-size="12.5" fill="#4b5853" xml:space="preserve">  "content": "質問があります..." },</text>
    <text x="34" y="112" font-family="Menlo, monospace" font-size="12.5" fill="#4b5853" xml:space="preserve">{ "message_id": "29d5...",</text>
    <text x="34" y="132" font-family="Menlo, monospace" font-size="12.5" fill="#4b5853" xml:space="preserve">  "content": "とても良いアイディアですね！" },</text>
    <text x="34" y="166" font-family="Menlo, monospace" font-size="12.5" fill="#4b5853" xml:space="preserve">{ "message_id": "071a...",</text>
    <text x="34" y="186" font-family="Menlo, monospace" font-size="12.5" fill="#4b5853" xml:space="preserve">  "content": "逆に考えるとそういう手段もあるのか..." },</text>
    <text x="34" y="220" font-family="Menlo, monospace" font-size="12.5" fill="#4b5853" xml:space="preserve">{ "message_id": "4daf...",</text>
    <text x="34" y="240" font-family="Menlo, monospace" font-size="12.5" fill="#d45542" xml:space="preserve">  "content": "死んでください" },</text>
    <text x="34" y="274" font-family="Menlo, monospace" font-size="12.5" fill="#4b5853" xml:space="preserve">{ "message_id": "2722...",</text>
    <text x="34" y="294" font-family="Menlo, monospace" font-size="12.5" fill="#4b5853" xml:space="preserve">  "content": "パチパチ" }</text>
    <text x="18" y="324" font-family="Menlo, monospace" font-size="12.5" fill="#4b5853" xml:space="preserve">]</text>
  </g>
  <g transform="translate(510 250)">
    <rect x="0" y="-18" width="280" height="104" rx="24" fill="#8cc563"/>
    <path d="M112 82l28 44 20-44" fill="#8cc563"/>
    <text x="140" y="10" text-anchor="middle" font-family="Avenir" font-size="17" fill="#365f52" font-weight="700">ペルソナ</text>
    <text x="140" y="36" text-anchor="middle" font-family="Avenir" font-size="15" fill="#365f52">あなたは、与えられた文章が</text><text x="140" y="57" text-anchor="middle" font-family="Avenir" font-size="15" fill="#365f52">有害なコンテンツではないかを</text>
    <text x="140" y="78" text-anchor="middle" font-family="Avenir" font-size="15" fill="#365f52">確認するプロです...</text>
    <rect x="88" y="140" width="105" height="80" rx="8" fill="#19a690"/>
    <text x="140" y="175" text-anchor="middle" font-family="Avenir" font-size="18" fill="white" font-weight="700">Bedrock</text>
    <text x="140" y="200" text-anchor="middle" font-family="Avenir" font-size="16" fill="white">Nova Micro</text>
    <path d="M-10 180H86" stroke="#566ed1" stroke-width="3" marker-end="url(#arrow)" fill="none"/><path d="M193 180H348" stroke="#566ed1" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
    <path d="M30 260H250" stroke="#566ed1" stroke-width="3" fill="none"/>
    <text x="140" y="292" text-anchor="middle" font-family="Avenir" font-size="20" fill="#4b5853">レイテンシー 1.6 秒</text>
  </g>
  <g transform="translate(860 210)">
    <rect x="0" y="0" width="250" height="350" fill="#fff" stroke="#8797c7" stroke-width="2"/>
    <text x="20" y="30" font-family="Menlo, monospace" font-size="13" fill="#4b5853" xml:space="preserve">[</text>
    <text x="34" y="54" font-family="Menlo, monospace" font-size="13" fill="#4b5853" xml:space="preserve">{ "categories": [],</text>
    <text x="34" y="73" font-family="Menlo, monospace" font-size="13" fill="#4b5853" xml:space="preserve">  "language": "ja" },</text>
    <text x="34" y="104" font-family="Menlo, monospace" font-size="13" fill="#4b5853" xml:space="preserve">{ "categories": [],</text>
    <text x="34" y="123" font-family="Menlo, monospace" font-size="13" fill="#4b5853" xml:space="preserve">  "language": "ja" },</text>
    <text x="34" y="154" font-family="Menlo, monospace" font-size="13" fill="#4b5853" xml:space="preserve">{ "categories": [],</text>
    <text x="34" y="173" font-family="Menlo, monospace" font-size="13" fill="#4b5853" xml:space="preserve">  "language": "ja" },</text>
    <text x="34" y="204" font-family="Menlo, monospace" font-size="13" fill="#4b5853" xml:space="preserve">{ "categories":</text>
    <text x="34" y="223" font-family="Menlo, monospace" font-size="13" fill="#d45542" xml:space="preserve">  ["self-harm"],</text>
    <text x="34" y="242" font-family="Menlo, monospace" font-size="13" fill="#4b5853" xml:space="preserve">  "language": "ja" },</text>
    <text x="34" y="270" font-family="Menlo, monospace" font-size="13" fill="#4b5853" xml:space="preserve">{ "categories": [],</text>
    <text x="34" y="289" font-family="Menlo, monospace" font-size="13" fill="#4b5853" xml:space="preserve">  "language": "ja" }</text>
    <text x="20" y="314" font-family="Menlo, monospace" font-size="13" fill="#4b5853" xml:space="preserve">]</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#566ed1"/></marker></defs>
</svg>