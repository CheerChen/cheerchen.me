<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Load test and quota increase</title>
  <desc id="desc">E2E load test showed 4xx errors once requests passed 600,000 per minute (10,000 RPS on average). Lambda showed no errors, so throttling was judged to happen at API Gateway, and the quotas were raised to 30,000 RPS for API Gateway and 50,000 concurrent executions for Lambda.</desc>
  <rect width="1200" height="675" fill="#fbfbf8"/>
  <text x="72" y="78" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="34" fill="#365f52">負荷試験と上限緩和</text>
  <text x="1070" y="78" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#33426f">TBS</text>
  <line x1="72" y1="98" x2="1060" y2="98" stroke="#c8d0ca" stroke-width="3"/>
  <g font-family="Avenir, Helvetica, Arial, sans-serif" fill="#4b5853">
    <text x="92" y="140" font-size="21">Amazon API Gateway と AWS Lambda を組み合わせた E2E の負荷試験</text>
    <text x="104" y="172" font-size="18">• Amazon API Gateway 標準クオータ　10,000 RPS</text>
  </g>

  <!-- what the test showed, and what was raised -->
  <g font-family="Avenir, Helvetica, Arial, sans-serif" font-size="19" fill="#4b5853" text-anchor="middle">
    <rect x="200" y="196" width="800" height="78" fill="#fff" stroke="#e07474" stroke-width="2"/>
    <rect x="372.5" y="212.0" width="479.3" height="20.0" data-mark="m07-threshold" fill="#fff06a"/>
    <text x="600" y="228">毎分 <tspan id="m07-threshold" font-weight="700">600,000 リクエスト（平均 10,000 RPS）を超えた時点</tspan>で</text>
    <text x="600" y="258">400 番台エラーが増えた</text>
    <path d="M600 280v24" stroke="#888" stroke-width="10" marker-end="url(#fat)"/>

    <rect x="200" y="322" width="800" height="78" fill="#fff" stroke="#5aa96b" stroke-width="2"/>
    <text x="600" y="354">統合先の AWS Lambda 関数にエラーは観測されなかったため、</text>
    <rect x="293.2" y="368.0" width="472.1" height="20.0" data-mark="m07-throttle" fill="#fff06a"/>
    <text x="600" y="384"><tspan id="m07-throttle" font-weight="700">Amazon API Gateway レベルでスロットリングが発生</tspan>していると判断*</text>
    <text x="204" y="420" font-size="13.5" fill="#6b716d" text-anchor="start">*Amazon API Gateway の標準メトリクスでは、400 番台のエラーが発生していることしかわからないため、</text>
    <text x="204" y="439" font-size="13.5" fill="#6b716d" text-anchor="start">AWS Lambda 側のエラーではないことの確認が必要</text>
    <path d="M600 448v24" stroke="#888" stroke-width="10" marker-end="url(#fat)"/>

    <rect x="200" y="490" width="800" height="112" fill="#fff" stroke="#5aa96b" stroke-width="2"/>
    <text x="600" y="522">上限緩和したクオータ（一部）</text>
    <rect x="657.6" y="542.0" width="110.0" height="20.0" data-mark="m07-apigw" fill="#fff06a"/>
    <text x="330" y="558" text-anchor="start">• Amazon API Gateway Throttle Rate　<tspan id="m07-apigw" font-weight="700">30,000 RPS</tspan></text>
    <rect x="671.8" y="572.0" width="69.9" height="20.0" data-mark="m07-lambda" fill="#fff06a"/>
    <text x="330" y="588" text-anchor="start">• AWS Lambda Concurrent Executions　<tspan id="m07-lambda" font-weight="700">50,000</tspan></text>
  </g>

  <defs><marker id="fat" markerWidth="4" markerHeight="4" refX="1.5" refY="2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,4 L2.6,2 z" fill="#888"/></marker></defs>
</svg>
