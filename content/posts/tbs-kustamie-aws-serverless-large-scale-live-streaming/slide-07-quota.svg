<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Load test and quota increase</title>
  <desc id="desc">E2E load test showed 4xx errors once requests passed 600,000 per minute (10,000 RPS on average). Lambda showed no errors, so throttling was judged to happen at API Gateway, and the quotas were raised to 30,000 RPS for API Gateway and 50,000 concurrent executions for Lambda. The CloudWatch chart shows the request count and the 4xx errors rising together.</desc>
  <rect width="1200" height="675" fill="#fbfbf8"/>
  <text x="72" y="78" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="34" fill="#365f52">負荷試験と上限緩和</text>
  <text x="1070" y="78" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#33426f">TBS</text>
  <line x1="72" y1="98" x2="1060" y2="98" stroke="#c8d0ca" stroke-width="3"/>
  <g font-family="Avenir, Helvetica, Arial, sans-serif" fill="#4b5853">
    <text x="92" y="140" font-size="21">Amazon API Gateway と AWS Lambda を組み合わせた E2E の負荷試験</text>
    <text x="104" y="172" font-size="18">• Amazon API Gateway 標準クオータ　10,000 RPS</text>
  </g>

  <!-- left: what the test showed, and what was raised -->
  <g font-family="Avenir, Helvetica, Arial, sans-serif" font-size="17" fill="#4b5853" text-anchor="middle">
    <rect x="92" y="192" width="600" height="74" fill="#fff" stroke="#e07474" stroke-width="2"/>
    <rect x="188.0" y="208.0" width="429.7" height="17.0" data-mark="m07-threshold" fill="#fff06a"/>
    <text x="392" y="222">毎分 <tspan id="m07-threshold" font-weight="700">600,000 リクエスト（平均 10,000 RPS）を超えた時点</tspan>で</text>
    <text x="392" y="250">400 番台エラーが増えた</text>
    <path d="M392 272v26" stroke="#888" stroke-width="10" marker-end="url(#fat)"/>

    <rect x="92" y="318" width="600" height="74" fill="#fff" stroke="#5aa96b" stroke-width="2"/>
    <text x="392" y="347">統合先の AWS Lambda 関数にエラーは観測されなかったため、</text>
    <rect x="117.1" y="362.0" width="423.2" height="17.0" data-mark="m07-throttle" fill="#fff06a"/>
    <text x="392" y="376"><tspan id="m07-throttle" font-weight="700">Amazon API Gateway レベルでスロットリングが発生</tspan>していると判断*</text>
    <text x="96" y="412" font-size="12.5" fill="#6b716d" text-anchor="start">*Amazon API Gateway の標準メトリクスでは、400 番台のエラーが発生していることしか</text>
    <text x="96" y="429" font-size="12.5" fill="#6b716d" text-anchor="start">わからないため、AWS Lambda 側のエラーではないことの確認が必要</text>
    <path d="M392 438v26" stroke="#888" stroke-width="10" marker-end="url(#fat)"/>

    <rect x="92" y="484" width="600" height="104" fill="#fff" stroke="#5aa96b" stroke-width="2"/>
    <text x="392" y="512">上限緩和したクオータ（一部）</text>
    <rect x="442.7" y="532.0" width="99.2" height="17.0" data-mark="m07-apigw" fill="#fff06a"/>
    <text x="150" y="546" text-anchor="start">• Amazon API Gateway Throttle Rate　<tspan id="m07-apigw" font-weight="700">30,000 RPS</tspan></text>
    <rect x="455.4" y="560.0" width="63.4" height="17.0" data-mark="m07-lambda" fill="#fff06a"/>
    <text x="150" y="574" text-anchor="start">• AWS Lambda Concurrent Executions　<tspan id="m07-lambda" font-weight="700">50,000</tspan></text>
  </g>

  <!-- right: the CloudWatch chart from the test -->
  <g font-family="Avenir, Helvetica, Arial, sans-serif">
    <rect x="720" y="150" width="430" height="300" rx="4" fill="#fff" stroke="#c9d2e3"/>
    <text x="784" y="178" font-size="11" fill="#6b716d">各種ユニット</text>
    <g font-size="11" fill="#8a8f8c" text-anchor="end">
      <text x="770" y="404">0</text><text x="770" y="370">100k</text><text x="770" y="336">200k</text><text x="770" y="302">300k</text>
      <text x="770" y="268">400k</text><text x="770" y="234">500k</text><text x="770" y="200">600k</text><text x="770" y="166">700k</text>
    </g>
    <g stroke="#e6e9ee"><line x1="778" y1="366" x2="1136" y2="366"/><line x1="778" y1="332" x2="1136" y2="332"/>
      <line x1="778" y1="298" x2="1136" y2="298"/><line x1="778" y1="264" x2="1136" y2="264"/>
      <line x1="778" y1="230" x2="1136" y2="230"/><line x1="778" y1="196" x2="1136" y2="196"/><line x1="778" y1="162" x2="1136" y2="162"/></g>
    <line x1="778" y1="400" x2="1136" y2="400" stroke="#b9bfc7"/>
    <line x1="1058" y1="160" x2="1058" y2="404" stroke="#9aa3ad" stroke-width="1"/>
    <path d="M840 399 L1058 400 L1104 401" fill="none" stroke="#e8902c" stroke-width="2.5"/>
    <path d="M840 400 C900 398 980 340 1058 193 C1068 175 1076 163 1086 162 L1100 162 L1104 214" fill="none" stroke="#c9553f" stroke-width="2.5"/>
    <path d="M1058 400 C1066 374 1074 368 1082 370 C1090 371 1094 378 1098 382" fill="none" stroke="#8f5fa8" stroke-width="2.5"/>
    <circle cx="1058" cy="196" r="3.5" fill="#fff" stroke="#c9553f" stroke-width="2"/>
    <g font-size="10.5" fill="#5f6b7a">
      <rect x="732" y="428" width="9" height="9" fill="#e8902c"/><text x="745" y="436">RPS</text>
      <rect x="778" y="428" width="9" height="9" fill="#c9553f"/><text x="791" y="436">Count</text>
      <rect x="832" y="428" width="9" height="9" fill="#8f5fa8"/><text x="845" y="436">4XXError</text>
      <rect x="900" y="428" width="9" height="9" fill="#8a6a55"/><text x="913" y="436">5XXError</text>
    </g>
    <rect x="958" y="458" width="192" height="72" rx="3" fill="#fff" stroke="#e07474" stroke-width="1.5"/>
    <g font-size="12" fill="#4b5853">
      <circle cx="972" cy="476" r="4" fill="none" stroke="#c9553f" stroke-width="1.6"/><text x="982" y="480">Count</text><text x="1140" y="480" text-anchor="end">609,946</text>
      <circle cx="972" cy="497" r="4" fill="none" stroke="#e8902c" stroke-width="1.6"/><text x="982" y="501">RPS</text><text x="1140" y="501" text-anchor="end">10,166</text>
      <circle cx="972" cy="518" r="4" fill="none" stroke="#8f5fa8" stroke-width="1.6"/><text x="982" y="522">4XXError</text><text x="1140" y="522" text-anchor="end">8,820</text>
    </g>
    <text x="732" y="476" font-size="15" fill="#4b5853" text-decoration="underline">API 負荷テストの結果</text>
    <text x="732" y="498" font-size="13" fill="#4b5853">呼び出し回数とエラーの</text>
    <text x="732" y="516" font-size="13" fill="#4b5853">増分が一致している</text>
    <g font-size="13" fill="#5f6b7a">
      <text x="732" y="556">赤線</text><text x="822" y="556">API 呼び出し回数（分間）</text>
      <text x="732" y="576">オレンジ線</text><text x="822" y="576">平均 RPS</text>
      <text x="732" y="596">紫線</text><text x="822" y="596">400 番台エラー</text>
    </g>
  </g>
  <defs><marker id="fat" markerWidth="4" markerHeight="4" refX="1.5" refY="2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,4 L2.6,2 z" fill="#888"/></marker></defs>
</svg>
