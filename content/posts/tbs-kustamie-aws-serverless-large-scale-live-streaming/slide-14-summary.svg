<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Kustamie summary</title>
  <desc id="desc">Summary of serverless architecture, IVS, multi-tier cache, async processing, Nova moderation, and beta schedule.</desc>
  <rect width="1200" height="675" fill="#fbfbf8"/>
  <text x="72" y="78" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="34" fill="#365f52">まとめ</text>
  <text x="1070" y="78" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#33426f">TBS</text>
  <line x1="72" y1="98" x2="1060" y2="98" stroke="#c8d0ca" stroke-width="3"/>
  <g font-family="Avenir" font-size="21" fill="#4b5853">
    <text x="90" y="150">Kustamie は AWS のサーバーレスサービスをフル活用して、</text>
    <text x="90" y="186"><tspan fill="#d45542" font-weight="700" text-decoration="underline">数万人規模の大規模配信を行う</tspan>ことができた</text>
    <text x="118" y="242">• Amazon IVS を使って、<tspan fill="#d45542" font-weight="700" text-decoration="underline">大規模でも安定した映像配信・機能提供</tspan>を実現</text>
    <text x="118" y="286">• Amazon API Gateway ステージキャッシュ・AWS Lambda 関数のグローバル変数・</text>
    <text x="138" y="314">Amazon ElastiCache を組み合わせた<tspan fill="#d45542" font-weight="700" text-decoration="underline">多段キャッシュ</tspan>構成</text>
    <text x="118" y="358">• 時間的コストの高い処理を<tspan fill="#d45542" font-weight="700" text-decoration="underline">非同期化して</tspan>、API 全体のパフォーマンスを向上</text>
    <text x="90" y="420">また、AWS の生成 AI サービスが安心・安全なプラットフォームの構築に寄与している</text>
    <text x="118" y="464">• Amazon Nova モデルを使って、<tspan fill="#d45542" font-weight="700" text-decoration="underline">高速なコンテンツモデレーション</tspan>を提供</text>
  </g>
  <text x="600" y="590" font-family="Avenir" font-size="24" fill="#4b5853" text-anchor="middle"><tspan font-size="42" font-weight="700" fill="#51704f">Kustamie</tspan> は、<tspan fill="#d45542">2026 年秋のベータ版提供開始</tspan>を予定しています！</text>
</svg>
