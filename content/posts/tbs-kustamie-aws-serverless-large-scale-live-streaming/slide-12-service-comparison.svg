<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Comparison with other moderation services</title>
  <desc id="desc">Comparison among Amazon Comprehend Trust and Safety, Bedrock third-party models, and Amazon Nova Micro.</desc>
  <rect width="1200" height="675" fill="#fbfbf8"/>
  <text x="72" y="78" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="34" fill="#365f52">他サービスとの比較</text>
  <text x="1070" y="78" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#33426f">TBS</text>
  <line x1="72" y1="98" x2="1060" y2="98" stroke="#c8d0ca" stroke-width="3"/>
  <text x="90" y="150" font-family="Avenir" font-size="22" fill="#4b5853">実装時に他サービスとの比較を行ったが、応答速度と柔軟性の面から Amazon Nova Micro を選択した</text>
  <g font-family="Avenir" font-size="17" fill="#4b5853">
    <rect x="96" y="186" width="548" height="178" fill="#fff" stroke="#e3ad54" stroke-width="2"/>
    <text x="118" y="220" font-size="18" text-decoration="underline">候補①：Amazon Comprehend - Trust and Safety</text>
    <text x="126" y="256">• 与えられた文章が不適切なコンテンツではないか、</text>
    <text x="142" y="280">複数観点で確認する</text>
    <text x="126" y="312">• 学習済みのデータを用いるためレスポンスが早い</text>
    <text x="126" y="344">• 対応言語が<tspan fill="#315bd6" font-weight="700">英語のみ</tspan>（2025/10 現在）</text>

    <rect x="96" y="392" width="548" height="178" fill="#fff" stroke="#e3ad54" stroke-width="2"/>
    <text x="118" y="426" font-size="18" text-decoration="underline">候補②：Amazon Bedrock (Serverless Third Party Models)</text>
    <text x="126" y="462">• 生成 AI を使って、不適切なコンテンツの確認を行う</text>
    <text x="126" y="494">• 多言語対応</text>
    <text x="126" y="526">• Anthropic Claude などのサードパーティモデルを使うと、</text>
    <text x="142" y="550"><tspan fill="#315bd6" font-weight="700">レスポンスが遅い</tspan>（検証実施時）</text>

    <rect x="672" y="186" width="430" height="178" fill="#fff" stroke="#5aa96b" stroke-width="2"/>
    <text x="694" y="220" font-size="18" text-decoration="underline">Amazon Nova Micro</text>
    <text x="702" y="256">• サードパーティモデルと比べて</text>
    <text x="718" y="280" fill="#d45542" font-weight="700">レスポンス速度が速い</text>
    <text x="702" y="312">• 学習済みでない不適切な単語でも識別可能</text>
    <text x="702" y="344">• <tspan fill="#d45542" font-weight="700">200 以上の言語</tspan>に対応</text>
  </g>
  <line x1="658" y1="180" x2="658" y2="576" stroke="#c8d0ca" stroke-width="2"/>
  <rect x="686" y="400" width="402" height="164" rx="4" fill="#2a2540"/>
  <text x="706" y="438" font-family="Avenir" font-size="22" fill="white" font-weight="700">Amazon Nova</text>
  <text x="706" y="468" font-family="Avenir" font-size="20" fill="white">foundation models</text>
  <g font-family="Avenir" font-size="13" fill="white" text-anchor="middle">
    <rect x="706" y="490" width="56" height="54" rx="3" fill="#579ad7"/><text x="734" y="522">Micro</text>
    <rect x="768" y="490" width="56" height="54" rx="3" fill="#579ad7"/><text x="796" y="522">Lite</text>
    <rect x="830" y="490" width="56" height="54" rx="3" fill="#7e5fe0"/><text x="858" y="522">Pro</text>
    <rect x="892" y="490" width="56" height="54" rx="3" fill="#8e48d6"/><text x="920" y="522">Premier</text>
    <rect x="954" y="490" width="56" height="54" rx="3" fill="#9a3ee3"/><text x="982" y="522">Canvas</text>
    <rect x="1016" y="490" width="56" height="54" rx="3" fill="#9a3ee3"/><text x="1044" y="522">Reel</text>
  </g>
</svg>
