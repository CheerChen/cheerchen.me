    <circle cx="701.0" cy="561.5" r="9" fill="#f2b233"/><text x="701.0" y="565.5" font-size="11" font-weight="700" fill="#5a3b00" text-anchor="middle">4</text>
    <rect x="756.9" y="578" width="43.4" height="21" fill="#c79bf2"/><text x="778.7" y="593" font-size="11.5" fill="#4a2d73" text-anchor="middle">Init</text>
