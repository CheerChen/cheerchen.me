<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">API Gateway and Lambda load metrics</title>
  <desc id="desc">Three load indicators: API Gateway throttle rate (10,000 req/s by default), Lambda concurrent executions (1,000 by default; the number of running execution environments, requests per second times seconds per request), and Lambda scaling rate (1,000 instances or 10,000 req/s every 10 seconds). A timeline from the AWS documentation shows ten requests, some with an Init phase and some reusing an environment, and the concurrency at t1 to t6: 3, 5, 4, 6, 5, 2.</desc>
  <rect width="1200" height="675" fill="#fbfbf8"/>
  <text x="72" y="78" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="34" fill="#365f52">Amazon API Gateway + AWS Lambda の負荷指標</text>
  <text x="1070" y="78" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#33426f">TBS</text>
  <line x1="72" y1="98" x2="1060" y2="98" stroke="#c8d0ca" stroke-width="3"/>
  <g font-family="Avenir, Helvetica, Arial, sans-serif" font-size="19" fill="#4b5853">
    <text x="95" y="146" text-decoration="underline">Amazon API Gateway</text>
    <text x="116" y="178" fill="#d45542" font-weight="700">• Throttle Rate</text>
    <text x="150" y="208">• 秒間リクエスト数の制限（リージョンレベル）</text>
    <text x="150" y="238">• デフォルト: 10,000 req/s</text>
    <text x="95" y="286" text-decoration="underline">AWS Lambda</text>
    <text x="116" y="318" fill="#d45542" font-weight="700">• Concurrent executions（同時実行数）</text>
    <text x="150" y="348">• リクエスト数ではなく、実際に稼働しているコンピューティング環境数（関数ごと）</text>
    <text x="170" y="376" text-decoration="underline">同時実行数 = 1 秒あたりのリクエスト数 × 1 リクエストの所要時間（秒）</text>
    <text x="150" y="406">• デフォルト: 1,000</text>
    <text x="116" y="448" fill="#d45542" font-weight="700">• Scaling Rate</text>
    <text x="150" y="478" font-size="18">• コンピューティング環境が新規に</text>
    <text x="166" y="503" font-size="18">デプロイされるレート</text>
    <text x="150" y="533" font-size="18">• 10 秒ごとに 1,000 インスタンス</text>
    <text x="166" y="558" font-size="18">（もしくは 10,000 req/s）</text>
    <text x="166" y="583" font-size="18">同時実行数の 10 倍に自動設定</text>
  </g>
  <text x="1140" y="420" font-family="Avenir, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8f8c" text-anchor="end">（AWS ドキュメントの図をもとに作成）</text>
  <g font-family="Avenir, Helvetica, Arial, sans-serif">
    <text x="596" y="456" font-size="14" font-style="italic" fill="#b55a4a" text-anchor="end">Time</text>
    <line x1="604" y1="452" x2="1148" y2="452" stroke="#c46855" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="628.5" y1="438" x2="628.5" y2="638" stroke="#5aa96b" stroke-width="1.6" stroke-dasharray="2,3"/>
    <text x="631.5" y="440" font-size="13" font-style="italic" fill="#3f8a50">t1</text>
    <text x="631.5" y="656" font-size="13" fill="#3f8a50">3</text>
    <line x1="767.1" y1="438" x2="767.1" y2="638" stroke="#5aa96b" stroke-width="1.6" stroke-dasharray="2,3"/>
    <text x="770.1" y="440" font-size="13" font-style="italic" fill="#3f8a50">t2</text>
    <text x="770.1" y="656" font-size="13" fill="#3f8a50">5</text>
    <line x1="820.2" y1="438" x2="820.2" y2="638" stroke="#5aa96b" stroke-width="1.6" stroke-dasharray="2,3"/>
