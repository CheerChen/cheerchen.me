    <text x="1122.7" y="656" font-size="13" fill="#3f8a50">2</text>
    <rect x="610.0" y="470" width="43.9" height="21" fill="#c79bf2"/><text x="631.9" y="485" font-size="11.5" fill="#4a2d73" text-anchor="middle">Init</text>
