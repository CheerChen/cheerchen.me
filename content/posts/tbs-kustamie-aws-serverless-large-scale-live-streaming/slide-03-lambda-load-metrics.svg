    <rect x="871.1" y="470" width="166.3" height="21" fill="#8b8cf0"/><text x="954.2" y="485" font-size="11.5" fill="#ffffff" text-anchor="middle">Invoke</text>
    <circle cx="858.1" cy="480.5" r="9" fill="#f2b233"/><text x="858.1" y="484.5" font-size="11" font-weight="700" fill="#5a3b00" text-anchor="middle">6</text>
    <rect x="897.4" y="497" width="166.8" height="21" fill="#8b8cf0"/><text x="980.8" y="512" font-size="11.5" fill="#ffffff" text-anchor="middle">Invoke</text>
    <circle cx="884.4" cy="507.5" r="9" fill="#f2b233"/><text x="884.4" y="511.5" font-size="11" font-weight="700" fill="#5a3b00" text-anchor="middle">7</text>
