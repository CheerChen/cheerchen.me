<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">Going async</title>
  <desc id="desc">The participation API split in two. Synchronous, about 100 ms: Amazon API Gateway integrates with AWS Lambda, which invokes an AWS Step Functions Express workflow that generates the UserID, issues the IVS token and sends an SQS record. Asynchronous, about 10,000 ms: Amazon SQS is consumed by AWS Lambda, which calls Amazon ECS. Response time went from a maximum of 12,000 ms to an average of about 150 ms.</desc>
  <style>
    text{font-family:'Amazon Ember',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
